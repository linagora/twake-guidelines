name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain release PR and bump version
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(echo "$PR" | jq -r '.number')
          # -R is required: this job has no checkout, so without it `gh pr merge`
          # tries to detect the repo from a local .git and fails. --auto only works
          # when a required check is pending; with none, fall back to a direct merge.
          gh pr merge "$number" -R "$GITHUB_REPOSITORY" --squash --auto \
            || gh pr merge "$number" -R "$GITHUB_REPOSITORY" --squash
